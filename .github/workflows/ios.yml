name: iOS CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8192m -XX:+UseG1GC"

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Konan (Kotlin/Native dependencies & toolchain)
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build iOS App with Xcode (Unsigned)
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -destination 'generic/platform=iOS' \
                   -derivedDataPath build/DerivedData \
                   -parallelizeTargets \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   build

    - name: Package IPA
      run: |
        APP_PATH=$(find build/DerivedData -name "iosApp.app" -type d | head -n 1)
        if [ -n "$APP_PATH" ]; then
          echo "Found built app at: $APP_PATH"
          
          # 1. Package standard IPA with Widgets
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          echo "Applying ad-hoc code signature for sideloading/TrollStore/AltStore..."
          if [ -d "build/Payload/iosApp.app/PlugIns" ]; then
            find "build/Payload/iosApp.app/PlugIns" -name "*.appex" -exec codesign --force --sign - --generate-entitlement-der {} \; 2>/dev/null || true
          fi
          codesign --force --sign - --generate-entitlement-der "build/Payload/iosApp.app"
          cd build
          zip -r -y Sirinium.ipa Payload
          cd ..
          rm -rf build/Payload

          # 2. Package standalone IPA without PlugIns (fallback for sideloaders that choke on appex)
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          rm -rf "build/Payload/iosApp.app/PlugIns"
          codesign --force --sign - --generate-entitlement-der "build/Payload/iosApp.app"
          cd build
          zip -r -y Sirinium-NoWidgets.ipa Payload
          cd ..
          rm -rf build/Payload
        else
          echo "Error: iosApp.app not found in build/DerivedData!"
          exit 1
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sirinium-iOS-IPA
        path: |
          build/Sirinium.ipa
          build/Sirinium-NoWidgets.ipa
        if-no-files-found: error
