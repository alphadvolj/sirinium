name: iOS CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8192m -XX:+UseG1GC"

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Kotlin Multiplatform Framework for iOS ARM64
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon

    - name: Build iOS App with Xcode (Unsigned)
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -destination 'generic/platform=iOS' \
                   -derivedDataPath build/DerivedData \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   clean build

    - name: Package IPA
      run: |
        APP_PATH=$(find build/DerivedData -name "iosApp.app" -type d | head -n 1)
        if [ -n "$APP_PATH" ]; then
          echo "Found built app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -y Sirinium.ipa Payload
          cd ..
        else
          echo "Error: iosApp.app not found in build/DerivedData!"
          exit 1
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sirinium-iOS-IPA
        path: build/Sirinium.ipa
        if-no-files-found: error
