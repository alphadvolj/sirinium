name: iOS CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8192m -XX:+UseG1GC"

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Konan (Kotlin/Native dependencies & toolchain)
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build iOS App with Xcode (Unsigned)
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -destination 'generic/platform=iOS' \
                   -derivedDataPath build/DerivedData \
                   -parallelizeTargets \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   build

    - name: Package IPA
      run: |
        APP_PATH=$(find build/DerivedData/Build/Products -name "Sirinium.app" -o -name "iosApp.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find build/DerivedData -name "Sirinium.app" -o -name "iosApp.app" -type d | grep "/Products/" | head -n 1)
        fi
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | grep -v "\.appex" | head -n 1)
        fi

        if [ -n "$APP_PATH" ]; then
          echo "Found built app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          APP_IN_PAYLOAD="build/Payload/$APP_NAME"

          if [ -d "$APP_PATH/PlugIns" ]; then
            echo "PlugIns folder found:"
            ls -la "$APP_PATH/PlugIns"
          else
            echo "WARNING: PlugIns folder NOT found in $APP_PATH"
          fi
          
          # 1. Package standard IPA with Widgets
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          echo "Applying ad-hoc code signature for sideloading/TrollStore/AltStore..."
          if [ -d "$APP_IN_PAYLOAD/PlugIns" ]; then
            for appex in "$APP_IN_PAYLOAD"/PlugIns/*.appex; do
              if [ -d "$appex" ]; then
                echo "Signing extension: $appex"
                codesign --force --sign - --entitlements iosApp/SiriniumWidget/SiriniumWidget.entitlements --generate-entitlement-der "$appex" || true
              fi
            done
          fi
          codesign --force --sign - --entitlements iosApp/iosApp/iosApp.entitlements --generate-entitlement-der "$APP_IN_PAYLOAD"
          cd build
          zip -r -y Sirinium.ipa Payload
          cd ..
          rm -rf build/Payload

          # 2. Package standalone IPA without PlugIns (fallback for sideloaders that choke on appex)
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          rm -rf "$APP_IN_PAYLOAD/PlugIns"
          codesign --force --sign - --entitlements iosApp/iosApp/iosApp.entitlements --generate-entitlement-der "$APP_IN_PAYLOAD"
          cd build
          zip -r -y Sirinium-NoWidgets.ipa Payload
          cd ..
          rm -rf build/Payload
        else
          echo "Error: Built app not found in build/DerivedData!"
          exit 1
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sirinium-iOS-IPA
        path: |
          build/Sirinium.ipa
          build/Sirinium-NoWidgets.ipa
        if-no-files-found: error
